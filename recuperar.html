<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/forms.css">
    <title>VUESU - Recuperar Contraseña</title>
</head>
<body>
    <!--Contendor del logo-->
    <div class="logo">
        <img src="./img/logo_horizontal.png" alt="" class="logo__imagen">
    </div>
    <section class="contenedor">
        <div class="contenedor__contenido">
            <h1>Recuperar Contraseña</h1>
            <hr>
            <form class="formulario" action="./animacion/cargando_crear_contraseña_recuperar.html">
                <input type="email" placeholder="E-mail">
                <p class="formulario__info">
                    Si el e-mail se encuentra registrado se enviará un link para continuar
                    con la recuperación de su contraseña
                </p>
                <input type="submit" value="Guardar">
            </form>
        </div>
    </section>
</body>
</html>
