<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle" />

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/ofertas.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <title>VUESU - OFERTAS</title>
</head>

<body>

    <!-- Logo -->
    <div class="logo">
        <img src="./img/logo_horizontal.png"
        alt="logo_horizontal"
        class="logo__imagen">
    </div>
    <section class="contenedor">

        <div class="contenedor__contenido">

            <h1>Ofertas</h1>

            <div class="contenedor__ofertas">

                <article class="tarjeta__oferta">

                    <img src="./img/parque_tikal.jpg"
                    alt="Parque Nacional Tikal"
                    class="tarjeta__imagen">

                    <div class="tarjeta__contenido">

                        <h2 class="tarjeta__lugar">
                            Parque Nacional Tikal
                        </h2>

                        <h3 class="tarjeta__pais">
                            Petén, <strong>Guatemala</strong>
                        </h3>

                        <p class="tarjeta__precio">
                            Desde <span>Q799</span>
                        </p>

                    </div>

                    <a href="https://flylikebutterfly.com/mini-guia-tikal/" class="oferta boton">
                        Ver Más
                    </a>

                </article>

                <article class="tarjeta__oferta">

                    <img src="./img/Parque_Tayrona.jpg"
                    alt="Parque Tayrona"
                    class="tarjeta__imagen">

                    <div class="tarjeta__contenido">

                        <h2 class="tarjeta__lugar">
                            Parque Nacional Natural Tayrona
                        </h2>

                        <h3 class="tarjeta__pais">
                            Magdalena, <strong>Colombia</strong>
                        </h3>

                        <p class="tarjeta__precio">
                            Desde <span>COP 150.600</span>
                        </p>

                    </div>

                    <a href="https://www.nationalgeographicla.com/viajes/2023/11/3-atracciones-del-parque-nacional-tayrona-que-van-a-enamorarte" class="oferta boton">
                        Ver Más
                    </a>

                </article>

                <!-- TARJETA 3 -->
                <article class="tarjeta__oferta">

                    <img src="./img/Parque_xetulul.jpg"
                    alt="IRTRA Xetulul"
                    class="tarjeta__imagen">

                    <div class="tarjeta__contenido">

                        <h2 class="tarjeta__lugar">
                            IRTRA Xetulul
                        </h2>

                        <h3 class="tarjeta__pais">
                            Retalhuleu, <strong>Guatemala</strong>
                        </h3>

                        <p class="tarjeta__precio">
                            Desde <span>Q599</span>
                        </p>

                    </div>
                    <a href="https://irtra.org.gt/parques/" class="oferta boton">
                        Ver Más
                    </a>

                </article>

            </div>
        </div>

    </section>

</body>
</html>
