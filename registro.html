<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/forms.css">
    <title>VUESU - Registro</title>
</head>
<body>
    <!--Contendor del logo-->
    <div class="logo">
        <img src="./img/logo_horizontal.png" alt="" class="logo__imagen">
    </div>
    <!-- Contenedor del formulario de registro-->
    <section class="contenedor">
        <div class="contenedor__contenido">
            <h1>Registro</h1>
            <hr>
            <form class="formulario" action="./animacion/cargando_crear_contrasena.html">
                <input type="text" placeholder="Nombre Completo">
                <input type="number" placeholder="No. identificación">
                <input type="email" placeholder="E-mail">
                <input type="number" placeholder="Télefono"> 
                <select name="" id="">
                    <option value="" selected disabled>Ciudad</option>
                    <option value="ciudad_guatemala">Ciudad de Guatemala</option>
                    <option value="bucaramanga">Bucaramanga</option>
                    <option value="cajasan">Cajasan</option>
                    <option value="cucuta">Cucuta</option>
                </select>
                <input type="submit" value="Guardar">
            </form>
        </div>
    </section>
</body>
</html>
